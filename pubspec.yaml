name: coffee_pos
description: POS Coffee Shop Offline

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  shared_preferences: ^2.2.3

  # Image
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Printer
  blue_thermal_printer: ^1.1.0
  esc_pos_utils: ^1.1.0

  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/