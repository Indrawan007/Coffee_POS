name: coffee_pos
description: POS Coffee Shop Offline

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

  # Image
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1

  print_bluetooth_thermal: ^1.0.8
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ✅ Hanya package yang wajib untuk build
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/